name: Verify Latvia proxy and domestic LTV streams
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Latvia exit and official LTV1/LTV7 APIs
        env:
          LV_PROXY_URL: ${{ secrets.LV_PROXY_URL }}
          NO_PROXY: ''
          no_proxy: ''
        run: |
          python -m py_compile latvia/lv_proxy_probe.py
          python -u latvia/lv_proxy_probe.py
