name: Verify Latvia proxy and domestic LTV streams
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'latvia/lv_proxy_probe.py'
      - '.github/workflows/latvia-proxy-test.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify syntax and proxy diagnostics
        run: |
          python -m py_compile latvia/lv_proxy_probe.py
          python -u latvia/lv_proxy_probe.py --geo-only --optional
