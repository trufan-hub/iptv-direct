name: Check Latvia TV public HLS candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'latvia/candidates.json'
      - 'latvia/probe.py'
      - '.github/workflows/latvia-probe.yml'
permissions:
  contents: read
jobs:
  test-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Latvian HLS candidates
        run: python latvia/probe.py
