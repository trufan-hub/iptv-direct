name: Update IPTV Direct
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'build.py'
      - 'channels.json'
      - '.github/workflows/update.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: iptv-direct
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve direct Rutube HLS streams
        run: python build.py
      - name: Commit latest direct M3U
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/direct.m3u docs/report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update direct IPTV streams'
            git push
          fi
      - name: Configure Pages (optional until enabled)
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Upload Pages
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy Pages
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
